<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一般常識クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 開始画面 -->
  <div id="start-screen" class="screen">
    <div class="card">
      <h1>一般常識クイズ</h1>
      <p class="subtitle">全10問・5択形式</p>
      <button id="start-btn" class="btn btn-primary">スタート</button>
    </div>
  </div>

  <!-- 問題画面 -->
  <div id="quiz-screen" class="screen hidden">
    <div class="card">
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="progress-text" class="progress-text">問題 1 / 10</p>
      <p id="question-text" class="question-text"></p>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback hidden"></div>
      <button id="next-btn" class="btn btn-primary hidden">次の問題へ</button>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="result-screen" class="screen hidden">
    <div class="card">
      <h2>クイズ終了！</h2>
      <p id="score-text" class="score-text"></p>
      <p id="score-message" class="score-message"></p>
      <button id="retry-btn" class="btn btn-primary">もう一度挑戦する</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
